name: CI

on:
  push:
    branches: [ main, master, release ]
  pull_request:
    branches: [ main, master, release ]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> rust/target'

      - name: Build Rust Native Engine
        run: cargo build --manifest-path rust/Cargo.toml

      - name: Run Rust Workspace Tests & Integration Suites
        run: cargo test --workspace --manifest-path rust/Cargo.toml

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify Native Binary Runners
        run: npm test

      - name: Verify Packaging Tarball (Dry Run)
        run: npm pack --dry-run
