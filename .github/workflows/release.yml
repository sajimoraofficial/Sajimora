name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ''
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ''
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            suffix: ''
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }} --manifest-path rust/Cargo.toml

      - name: Package Artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          mkdir -p staging
          cp rust/target/${{ matrix.target }}/release/sajimora${{ matrix.suffix }} staging/
          cp rust/target/${{ matrix.target }}/release/sajimora-mcp${{ matrix.suffix }} staging/
          cp rust/target/${{ matrix.target }}/release/sajimora-source-pilot${{ matrix.suffix }} staging/
          cd staging
          7z a ../sajimora-${{ github.ref_name }}-${{ matrix.target }}.zip *
          cd ..
          certutil -hashfile sajimora-${{ github.ref_name }}-${{ matrix.target }}.zip SHA256 | findstr -v "hash" | findstr -v "CertUtil" | tr -d " \r\n" > sajimora-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256 || sha256sum sajimora-${{ github.ref_name }}-${{ matrix.target }}.zip > sajimora-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256

      - name: Package Artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p staging
          cp rust/target/${{ matrix.target }}/release/sajimora staging/
          cp rust/target/${{ matrix.target }}/release/sajimora-mcp staging/
          cp rust/target/${{ matrix.target }}/release/sajimora-source-pilot staging/
          tar -czvf sajimora-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C staging .
          sha256sum sajimora-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > sajimora-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

      - name: Upload Release Assets to Public Distribution
        uses: softprops/action-gh-release@v2
        with:
          repository: sajimoraofficial/sajimora
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            sajimora-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            sajimora-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
