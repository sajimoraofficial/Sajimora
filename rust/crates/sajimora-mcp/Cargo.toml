[package]
name = "sajimora-mcp"
description = "Sajimora MCP stdio adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "sajimora-mcp"
path = "src/main.rs"

[lib]
name = "sajimora_mcp"
path = "src/lib.rs"

[dependencies]
contract-core.workspace = true
source-index.workspace = true
verifier.workspace = true
rmcp.workspace = true
rmcp-macros.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tree-sitter = "=0.26.7"
tree-sitter-java = "=0.23.5"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
