[package]
name = "source-index"
description = "Experimental bounded immutable Git source capture and index ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha1 = "=0.10.6"
tree-sitter = "=0.26.7"
tree-sitter-java = "=0.23.5"
tree-sitter-typescript = "0.23.2"
rayon = "1.10"
contract-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile = "3"

